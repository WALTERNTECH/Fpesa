<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B4FD8" />
    <meta
      name="description"
      content="Fpesa — trade gold and global markets from Kenya. Live XAU/USD pricing, instant M-Pesa deposits and withdrawals, and a free demo account."
    />
    <title>Fpesa — Live Gold &amp; FX Trading</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* The boot screen lives in the document head so it renders on the first
         paint — before the bundle, the fonts, or the price feed have arrived. */
      :root {
        --boot-blue: #0b4fd8;
        --boot-ink: #0a0d14;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: radial-gradient(120% 80% at 50% 0%, #f4f8ff 0%, #ffffff 55%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }

      .boot-mark {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
      }
      /* Two counter-rotating arcs — the instrument-panel look, not a generic
         browser throbber. */
      .boot-mark::before,
      .boot-mark::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .boot-mark::before {
        inset: 0;
        border-top-color: var(--boot-blue);
        border-right-color: var(--boot-blue);
        animation: boot-spin 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .boot-mark::after {
        inset: 13px;
        border-bottom-color: rgba(11, 79, 216, 0.35);
        border-left-color: rgba(11, 79, 216, 0.35);
        animation: boot-spin 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite reverse;
      }
      .boot-glyph {
        font-family: 'Sora', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.03em;
        color: var(--boot-ink);
      }
      .boot-glyph span {
        color: var(--boot-blue);
      }

      .boot-bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 30px;
      }
      .boot-bars i {
        display: block;
        width: 4px;
        border-radius: 2px;
        background: var(--boot-blue);
        opacity: 0.85;
        animation: boot-tick 1.05s ease-in-out infinite;
      }
      .boot-bars i:nth-child(1) { height: 11px; animation-delay: 0s; }
      .boot-bars i:nth-child(2) { height: 20px; animation-delay: 0.09s; }
      .boot-bars i:nth-child(3) { height: 29px; animation-delay: 0.18s; }
      .boot-bars i:nth-child(4) { height: 17px; animation-delay: 0.27s; }
      .boot-bars i:nth-child(5) { height: 25px; animation-delay: 0.36s; }
      .boot-bars i:nth-child(6) { height: 13px; animation-delay: 0.45s; }

      .boot-status {
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #5a6478;
        min-height: 16px;
      }
      .boot-rail {
        width: 190px;
        height: 2px;
        border-radius: 2px;
        background: rgba(10, 13, 20, 0.08);
        overflow: hidden;
      }
      .boot-rail i {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--boot-blue), transparent);
        animation: boot-sweep 1.25s ease-in-out infinite;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-tick {
        0%, 100% { transform: scaleY(0.45); }
        50% { transform: scaleY(1); }
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(370%); }
      }

      /* Anyone who asks for reduced motion gets a still, legible boot screen. */
      @media (prefers-reduced-motion: reduce) {
        .boot-mark::before,
        .boot-mark::after,
        .boot-bars i,
        .boot-rail i {
          animation: none;
        }
        .boot-mark::before {
          border-color: var(--boot-blue);
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-live="polite" aria-label="Loading Fpesa">
      <div class="boot-mark">
        <div class="boot-glyph"><span>F</span>p</div>
      </div>
      <div class="boot-bars" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="boot-status" id="boot-status">Connecting to market feed</div>
      <div class="boot-rail" aria-hidden="true"><i></i></div>
    </div>

    <script>
      // Cycles the real boot stages. React clears this once the feed is live.
      (function () {
        var stages = [
          'Connecting to market feed',
          'Loading XAU/USD quotes',
          'Syncing live prices',
          'Preparing trading desk',
        ];
        var el = document.getElementById('boot-status');
        var i = 0;
        window.__fpesaBootTimer = setInterval(function () {
          i = (i + 1) % stages.length;
          if (el) el.textContent = stages[i];
        }, 900);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
