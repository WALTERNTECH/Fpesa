<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale is deliberately omitted: pinch-zoom stays available.
         viewport-fit=cover lets the safe-area insets do their job on a notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B4FD8" />
    <!-- Opts the page out of Android/Samsung forced-dark repainting, which
         otherwise turns the white background black on dark-themed phones. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Trade five synthetic volatility indices on Fpesa — positions from 5 to 60 seconds, deposits and withdrawals by M-Pesa, and a free demo account. Provably fair pricing you can verify yourself." />
    <link rel="canonical" href="https://www.fpesa.markets/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Waltern Tech LTD" />

    <!-- What WhatsApp, Telegram and search results show when the link is
         shared. Without these they fall back to guessing from the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fpesa" />
    <meta property="og:title" content="Fpesa — volatility index trading" />
    <meta property="og:description" content="Five volatility indices, 5-second to 60-second positions, M-Pesa in and out. Practise free on a demo account." />
    <meta property="og:url" content="https://www.fpesa.markets/" />
    <meta property="og:image" content="https://www.fpesa.markets/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Fpesa" />
    <meta property="og:locale" content="en_KE" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fpesa — volatility index trading" />
    <meta name="twitter:description" content="Five volatility indices, 5-second to 60-second positions, M-Pesa in and out." />
    <meta name="twitter:image" content="https://www.fpesa.markets/icon-512.png" />

    <!-- The title carries the words someone would actually search for. "Fpesa"
         alone ranks for nothing but the brand, and nobody searches a brand they
         have not heard of yet. -->
    <title>Fpesa — Volatility Index Trading in Kenya, M-Pesa Deposits</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browsers request /favicon.ico by name whatever these say, so it is a
         real file holding 16/32/48/64px. One oversized image is worse than
         none: a browser asked for 16 will skip an entry it would have to
         downscale from 192, which is how a tab ends up showing a blank circle.
         Google reads the 48 and wants that size or a multiple of it. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0B4FD8" />

    <!-- iOS ignores the manifest, so standalone behaviour is declared here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fpesa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* The boot screen lives in the document head so it renders on the first
         paint — before the bundle, the fonts, or the price feed have arrived. */
      :root {
        color-scheme: light;
        --boot-blue: #0b4fd8;
        --boot-ink: #0a0d14;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: radial-gradient(120% 80% at 50% 0%, #f4f8ff 0%, #ffffff 55%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }

      .boot-mark {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
      }
      /* Two counter-rotating arcs — the instrument-panel look, not a generic
         browser throbber. */
      .boot-mark::before,
      .boot-mark::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .boot-mark::before {
        inset: 0;
        border-top-color: var(--boot-blue);
        border-right-color: var(--boot-blue);
        animation: boot-spin 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .boot-mark::after {
        inset: 13px;
        border-bottom-color: rgba(11, 79, 216, 0.35);
        border-left-color: rgba(11, 79, 216, 0.35);
        animation: boot-spin 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite reverse;
      }
      .boot-glyph {
        font-family: 'Sora', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.03em;
        color: var(--boot-ink);
      }
      .boot-glyph span {
        color: var(--boot-blue);
      }

      .boot-bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 30px;
      }
      .boot-bars i {
        display: block;
        width: 4px;
        border-radius: 2px;
        background: var(--boot-blue);
        opacity: 0.85;
        animation: boot-tick 1.05s ease-in-out infinite;
      }
      .boot-bars i:nth-child(1) { height: 11px; animation-delay: 0s; }
      .boot-bars i:nth-child(2) { height: 20px; animation-delay: 0.09s; }
      .boot-bars i:nth-child(3) { height: 29px; animation-delay: 0.18s; }
      .boot-bars i:nth-child(4) { height: 17px; animation-delay: 0.27s; }
      .boot-bars i:nth-child(5) { height: 25px; animation-delay: 0.36s; }
      .boot-bars i:nth-child(6) { height: 13px; animation-delay: 0.45s; }

      /* The boot stages cycle in pure CSS. Doing this with an inline <script>
         would need a script-src hash in the CSP that has to be kept in sync
         with the markup by hand — not worth it for four labels. */
      .boot-slow {
        margin: 18px 0 0;
        max-width: 30ch;
        font-size: 12.5px;
        line-height: 1.5;
        text-align: center;
        color: #8b93a7;
        opacity: 0;
        animation: boot-slow-in 0.4s ease 18s forwards;
      }
      @keyframes boot-slow-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .boot-status {
        position: relative;
        width: 260px;
        height: 16px;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #5a6478;
        text-align: center;
      }
      .boot-status span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: boot-cycle 3.6s ease-in-out infinite;
      }
      .boot-status span:nth-child(1) { animation-delay: 0s; }
      .boot-status span:nth-child(2) { animation-delay: 0.9s; }
      .boot-status span:nth-child(3) { animation-delay: 1.8s; }
      .boot-status span:nth-child(4) { animation-delay: 2.7s; }
      @keyframes boot-cycle {
        0%, 2% { opacity: 0; }
        6%, 21% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      .boot-rail {
        width: 190px;
        height: 2px;
        border-radius: 2px;
        background: rgba(10, 13, 20, 0.08);
        overflow: hidden;
      }
      .boot-rail i {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--boot-blue), transparent);
        animation: boot-sweep 1.25s ease-in-out infinite;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-tick {
        0%, 100% { transform: scaleY(0.45); }
        50% { transform: scaleY(1); }
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(370%); }
      }

      /* Anyone who asks for reduced motion gets a still, legible boot screen. */
      @media (prefers-reduced-motion: reduce) {
        .boot-mark::before,
        .boot-mark::after,
        .boot-bars i,
        .boot-rail i {
          animation: none;
        }
        .boot-mark::before {
          border-color: var(--boot-blue);
          opacity: 0.35;
        }
        /* Without the cycle animation every stage would sit at opacity 0,
           leaving no status text at all. Pin the first one open. */
        .boot-status span {
          animation: none;
          opacity: 0;
        }
        .boot-status span:nth-child(1) {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.fpesa.markets/#organization",
            "name": "Fpesa",
            "legalName": "Waltern Tech LTD",
            "url": "https://www.fpesa.markets/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.fpesa.markets/icon-512.png",
              "width": 512,
              "height": 512
            },
            "areaServed": { "@type": "Country", "name": "Kenya" },
            "sameAs": ["https://t.me/KRYPTONinv"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.fpesa.markets/#website",
            "url": "https://www.fpesa.markets/",
            "name": "Fpesa",
            "inLanguage": "en-KE",
            "publisher": { "@id": "https://www.fpesa.markets/#organization" }
          },
          {
            "@type": "WebApplication",
            "name": "Fpesa",
            "url": "https://www.fpesa.markets/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "description": "Trade five synthetic volatility indices with positions from 5 to 60 seconds. Deposits and withdrawals by M-Pesa, and a free demo account to practise on.",
            "publisher": { "@id": "https://www.fpesa.markets/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free to open an account and practise on a demo balance."
            }
          }
        ]
      }
    </script>

    <div id="root"></div>

    <div id="boot" role="status" aria-live="polite" aria-label="Loading Fpesa">
      <div class="boot-mark">
        <div class="boot-glyph"><span>F</span>p</div>
      </div>
      <div class="boot-bars" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="boot-status">
        <span>Connecting to market feed</span>
        <span>Loading volatility indices</span>
        <span>Syncing live prices</span>
        <span>Preparing trading desk</span>
      </div>
      <div class="boot-rail" aria-hidden="true"><i></i></div>
      <!-- Revealed by a CSS animation after 18 seconds. The app bundle may be
           the thing that failed to load, so this cannot depend on any script
           running: if it did, the one case it exists for is the one case it
           would never appear in. -->
      <p class="boot-slow">
        This is taking longer than usual. Check your connection, then reload.
      </p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
